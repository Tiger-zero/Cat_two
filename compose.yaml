services:
  cat-two:
    image: ${CAT_TWO_IMAGE:-docker.io/tiger2896/cat_two:latest}
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MEMOS_DRIVER: sqlite
      MEMOS_INSTANCE_URL: "${MEMOS_INSTANCE_URL:-}"
      MEMOS_TRUSTED_PROXIES: "${MEMOS_TRUSTED_PROXIES:-none}"
      # Map NAS project variables to names supported by existing images.
      MEMOS_UID: "${MEMOS_UID:-${PUID:-}}"
      MEMOS_GID: "${MEMOS_GID:-${PGID:-}}"
      CAT_TWO_TELEGRAM_BOT_TOKEN: "${CAT_TWO_TELEGRAM_BOT_TOKEN:-}"
      CAT_TWO_TELEGRAM_USER_ID: "${CAT_TWO_TELEGRAM_USER_ID:-}"
      CAT_TWO_WECOM_CORP_ID: "${CAT_TWO_WECOM_CORP_ID:-}"
      CAT_TWO_WECOM_AGENT_ID: "${CAT_TWO_WECOM_AGENT_ID:-}"
      CAT_TWO_WECOM_CALLBACK_TOKEN: "${CAT_TWO_WECOM_CALLBACK_TOKEN:-}"
      CAT_TWO_WECOM_ENCODING_AES_KEY: "${CAT_TWO_WECOM_ENCODING_AES_KEY:-}"
      CAT_TWO_WECOM_USER_ID: "${CAT_TWO_WECOM_USER_ID:-}"
    ports:
      - "${CAT_TWO_BIND_IP:+${CAT_TWO_BIND_IP:-}:}${CAT_TWO_PORT:-5230}:5230"
    volumes:
      - cat_two_data:/var/opt/memos
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:5230/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  cat_two_data:
