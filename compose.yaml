# 保存为 compose.yaml，在文件所在目录运行 docker compose up -d。
services:
  cat-two:
    # 可以把 latest 换成具体版本，例如 0.09。
    image: docker.io/tiger2896/cat_two:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 按数据目录权限设置 UID/GID。改动已有实例的 UID/GID 时请先在宿主机调整原数据所有权。
      PUID: "1000"
      PGID: "10"
    ports:
      # 左边是访问端口。遇到端口冲突时可改成 "5231:5230"。
      - "5230:5230"
    volumes:
      # 保存 SQLite、笔记和附件。新装使用空卷，重建当前版本容器时沿用原卷。
      # 旧库请保留原卷和对应镜像。新装使用 NAS 绑定挂载时，先创建空目录，再替换下一行。
      # - /volume1/docker/cat2/data-current:/var/opt/memos
      - cat_two_data:/var/opt/memos
    healthcheck:
      # 从容器内检查应用和数据库是否就绪。
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:5230/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  cat_two_data:
