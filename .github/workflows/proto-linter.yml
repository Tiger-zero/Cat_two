name: Proto Linter

on:
  push:
    branches: [main]
    paths:
      - "proto/**"
      - ".github/workflows/proto-linter.yml"
  pull_request:
    branches: [main]
    paths:
      - "proto/**"
      - ".github/workflows/proto-linter.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Protos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup buf
        uses: bufbuild/buf-action@v1.7.0
        with:
          setup_only: true

      - name: Run buf lint
        run: buf lint proto --error-format=github-actions

      - name: Check buf format
        run: |
          if [[ $(buf format -d) ]]; then
            echo "❌ Proto files are not formatted. Run 'buf format -w' to fix."
            exit 1
          fi
