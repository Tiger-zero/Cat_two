name: Proto Linter

on:
  push:
    branches: [main]
    paths:
      - "proto/**"
      - "web/src/types/proto/**"
      - ".github/workflows/proto-linter.yml"
  pull_request:
    branches: [main]
    paths:
      - "proto/**"
      - "web/src/types/proto/**"
      - ".github/workflows/proto-linter.yml"
  workflow_call:
    inputs:
      release-verification:
        type: boolean
        default: false

concurrency:
  group: proto-linter-${{ inputs.release-verification && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Protos
    if: inputs.release-verification || github.event_name != 'push' || !contains(github.event.head_commit.message, '[publish dockerhub]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup buf
        uses: bufbuild/buf-action@v1.7.0
        with:
          setup_only: true
          version: 1.75.0
          cache: true

      - name: Run buf lint
        run: buf lint proto --error-format=github-actions

      - name: Check buf format
        run: buf format proto -d --exit-code

      - name: Verify generated Go, OpenAPI, and TypeScript are current
        run: |
          (cd proto && buf generate)
          changes="$(git status --porcelain -- proto/gen web/src/types/proto)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            echo "Run (cd proto && buf generate) and commit the generated changes."
            exit 1
          fi
