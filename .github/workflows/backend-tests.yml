name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - "proto/gen/openapi.yaml"
      - "server/frontend/dist/**"
      - "store/migration/**"
      - "store/seed/**"
      - "scripts/entrypoint.sh"
      - "scripts/release_version.sh"
      - ".golangci.yaml"
      - ".github/actions/setup-go/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - "proto/gen/openapi.yaml"
      - "server/frontend/dist/**"
      - "store/migration/**"
      - "store/seed/**"
      - "scripts/entrypoint.sh"
      - "scripts/release_version.sh"
      - ".golangci.yaml"
      - ".github/actions/setup-go/**"
      - ".github/workflows/backend-tests.yml"
  workflow_call:
    inputs:
      release-verification:
        type: boolean
        default: false

concurrency:
  group: backend-tests-${{ inputs.release-verification && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static Checks
    if: inputs.release-verification || github.event_name != 'push' || !contains(github.event.head_commit.message, '[publish dockerhub]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Verify go fix
        run: go fix -diff ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=3m

  tests:
    name: Tests (${{ matrix.test-group }})
    if: inputs.release-verification || github.event_name != 'push' || !contains(github.event.head_commit.message, '[publish dockerhub]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-group: [store, server, internal, other]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run tests
        run: |
          case "${{ matrix.test-group }}" in
            store)
              go test -v ./store/...
              ;;
            server)
              # Includes ./server/test, which boots the real server via
              # server.NewServer and smokes every router it mounts.
              go test -v -race ./server/...
              ;;
            internal)
              go test -v -race ./internal/...
              ;;
            other)
              go test -v -race \
                ./cmd/... ./core/... ./markdown/... ./filter/... ./proto/...
              go test -v ./scripts/...
              ;;
          esac
