name: Upgrade Smoke (legacy Memos)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-upgrade:
    name: Upgrade from legacy Memos (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run released Memos upgrade tests
        run: go test -v -count=1 -timeout 30m -run '^TestUpgrade(FromBaselineRelease|ThroughBaselineRelease)$' ./store/test/...
        env:
          DRIVER: sqlite
          LEGACY_MEMOS_UPGRADE_TESTS: "1"
