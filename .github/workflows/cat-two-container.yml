name: Cat_two Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - '!**/*_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - '!web/docs/**'
      - '!web/tests/**'
      - '!web/src/**/README.md'
      - 'proto/gen/openapi.yaml'
      - 'server/frontend/dist/**'
      - 'store/migration/**'
      - 'store/seed/**'
      - 'compose.yaml'
      - 'LICENSE'
      - '.dockerignore'
      - 'scripts/Dockerfile'
      - 'scripts/check_frontend_build.sh'
      - 'scripts/entrypoint.sh'
      - 'scripts/entrypoint_test.sh'
      - 'scripts/release_smoke_test.sh'
      - 'scripts/release_version.sh'
      - 'scripts/cat_two_docker_release.py'
      - 'scripts/cat_two_docker_release_test.py'
      - '.github/actions/setup-web/**'
      - '.github/workflows/cat-two-container.yml'
  workflow_dispatch:
    inputs:
      registry:
        description: Image registry
        type: choice
        options:
          - dockerhub
          - ghcr
        default: dockerhub

concurrency:
  # Serialize releases separately so an ordinary push cannot replace a pending publish.
  group: cat-two-container-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish dockerhub]'))) && github.ref || github.run_id }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: docker.io/tiger2896/cat_two
  GHCR_IMAGE: ghcr.io/tiger-zero/cat_two

jobs:
  backend:
    if: github.repository == 'Tiger-zero/Cat_two' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish dockerhub]')))
    uses: ./.github/workflows/backend-tests.yml
    with:
      release-verification: true

  frontend:
    if: github.repository == 'Tiger-zero/Cat_two' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish dockerhub]')))
    uses: ./.github/workflows/frontend-tests.yml
    with:
      release-verification: true

  proto:
    if: github.repository == 'Tiger-zero/Cat_two' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish dockerhub]')))
    needs: verify
    uses: ./.github/workflows/proto-linter.yml
    with:
      release-verification: true
      baseline: ${{ needs.verify.outputs.previous-commit }}

  verify:
    name: Check the container inputs
    if: github.repository == 'Tiger-zero/Cat_two' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.previous.outputs.image }}
      previous-commit: ${{ steps.previous.outputs.commit }}
    env:
      RELEASE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish dockerhub]')) }}
    steps:
      - name: Check changed container inputs
        id: scope
        if: github.event_name == 'push' && !github.event.created && !github.event.forced && !contains(github.event.head_commit.message, '[publish dockerhub]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # GitHub lists the entire file diff on page one, capped at 300 paths.
          # Check both paths of a rename and verify whenever the diff is uncertain.
          if gh api "repos/$GITHUB_REPOSITORY/compare/$PUSH_BEFORE...$PUSH_AFTER?page=1&per_page=1" |
            jq -e '
              # Match the pull_request path filters above.
              def container_input:
                (test("^(web/(docs|tests)/|web/src/(.*/)?README[.]md$)") | not)
                and (
                  (endswith(".go") and (endswith("_test.go") | not))
                  or test("^(web/|server/frontend/dist/|store/(migration|seed)/|[.]github/actions/setup-web/)")
                  or IN(
                    "go.mod", "go.sum", "proto/gen/openapi.yaml", "compose.yaml",
                    "LICENSE", ".dockerignore", "scripts/Dockerfile", "scripts/entrypoint.sh",
                    "scripts/entrypoint_test.sh", "scripts/release_smoke_test.sh", "scripts/release_version.sh",
                    "scripts/check_frontend_build.sh", "scripts/cat_two_docker_release.py",
                    "scripts/cat_two_docker_release_test.py", ".github/workflows/cat-two-container.yml"
                  )
                );

              (.status == "ahead" or .status == "identical")
              and (.files | type == "array" and length < 300)
              and all(.files[]; (.filename | type == "string") and
                (.status != "renamed" or (.previous_filename | type == "string")))
              and (any(.files[] | (.filename, .previous_filename) | strings; container_input) | not)
            ' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No container inputs changed."
          fi

      - uses: actions/checkout@v6
        if: steps.scope.outputs.skip != 'true'
        with:
          persist-credentials: false

      - name: Verify the default Compose configuration
        if: steps.scope.outputs.skip != 'true'
        shell: bash
        run: |
          docker compose config --format json |
            jq -e '.services["cat-two"] |
              .image == "docker.io/tiger2896/cat_two:latest"
              and .environment.PUID == "1000" and .environment.PGID == "10"
              and any(.ports[]; .published == "5230" and .target == 5230)
              and any(.volumes[]; .type == "volume" and .source == "cat_two_data" and .target == "/var/opt/memos")' >/dev/null

      - name: Test release and entrypoint scripts
        if: steps.scope.outputs.skip != 'true'
        run: |
          python3 -B scripts/cat_two_docker_release_test.py
          bash scripts/entrypoint_test.sh

      - uses: ./.github/actions/setup-web
        if: steps.scope.outputs.skip != 'true' && env.RELEASE_REQUESTED != 'true'

      - name: Build the embedded web app
        if: steps.scope.outputs.skip != 'true' && env.RELEASE_REQUESTED != 'true'
        working-directory: web
        run: pnpm release

      - name: Resolve version from the commit
        id: version
        if: steps.scope.outputs.skip != 'true'
        run: |
          version="$(bash scripts/release_version.sh development-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve the stable image for upgrade and API compatibility
        if: env.RELEASE_REQUESTED == 'true'
        id: previous
        run: |
          previous="$(docker buildx imagetools inspect "$DOCKERHUB_IMAGE:latest" --format '{{json .}}')"
          digest="$(jq -er '.manifest.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$previous")"
          commit="$(jq -er '[.image[].config.Labels["org.opencontainers.image.revision"]] | unique | select(length == 1) | .[0] | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$previous")"
          echo "image=$DOCKERHUB_IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.scope.outputs.skip != 'true' && env.RELEASE_REQUESTED != 'true'

      - name: Build the smoke-test image
        if: steps.scope.outputs.skip != 'true' && env.RELEASE_REQUESTED != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cat-two:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=cat-two-container
          cache-to: type=gha,mode=max,scope=cat-two-container

      - name: Verify the web app and persistent SQLite data
        if: steps.scope.outputs.skip != 'true' && env.RELEASE_REQUESTED != 'true'
        run: bash scripts/release_smoke_test.sh --fresh-only --candidate-image cat-two:smoke --expected-commit "$GITHUB_SHA"

  stage:
    name: Build the container candidate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish dockerhub]'))
    needs: [verify, backend, frontend, proto]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.registry.outputs.image }}
      candidate: ${{ steps.image.outputs.digest }}
      previous: ${{ needs.verify.outputs.previous }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: cat-two-frontend
          path: server/frontend/dist

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Select the candidate registry
        id: registry
        env:
          TARGET_REGISTRY: ${{ inputs.registry }}
        run: |
          image="$DOCKERHUB_IMAGE"
          if [[ "$TARGET_REGISTRY" == ghcr ]]; then
            image="$GHCR_IMAGE"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Sign in to Docker Hub
        if: inputs.registry != 'ghcr'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign in to GitHub Container Registry
        if: inputs.registry == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the candidate by digest without release tags
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.registry.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            io.github.tiger-zero.cat-two.release-run=${{ github.run_number }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=cat-two-container
          cache-to: type=gha,mode=max,scope=cat-two-container

  smoke:
    name: Verify the candidate on ${{ matrix.arch }}
    needs: stage
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Sign in to GitHub Container Registry
        if: inputs.registry == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Test the exact published candidate digest
        env:
          CANDIDATE: ${{ needs.stage.outputs.image }}@${{ needs.stage.outputs.candidate }}
          PREVIOUS: ${{ needs.stage.outputs.previous }}
          ARCHITECTURE: ${{ matrix.arch }}
        run: |
          bash scripts/release_smoke_test.sh --candidate-image "$CANDIDATE" \
            --previous-image "$PREVIOUS" --expected-commit "$GITHUB_SHA" \
            --platform "linux/$ARCHITECTURE"

  publish:
    name: Promote the tested container digest
    needs: [stage, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        if: inputs.registry != 'ghcr'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign in to GitHub Container Registry
        if: inputs.registry == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the numbered Docker Hub release and latest
        if: inputs.registry != 'ghcr'
        env:
          IMAGE_DIGEST: ${{ needs.stage.outputs.candidate }}
        run: python3 scripts/cat_two_docker_release.py "$IMAGE_DIGEST" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA"

      - name: Publish the verified GitHub Container Registry image
        if: inputs.registry == 'ghcr'
        env:
          IMAGE_DIGEST: ${{ needs.stage.outputs.candidate }}
        run: |
          docker buildx imagetools create --tag "$GHCR_IMAGE:sha-$GITHUB_SHA" \
            --tag "$GHCR_IMAGE:latest" "$GHCR_IMAGE@$IMAGE_DIGEST"
