name: Cat_two Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - '!**/*_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'proto/gen/openapi.yaml'
      - 'server/frontend/dist/**'
      - 'store/migration/**'
      - 'store/seed/**'
      - 'compose.yaml'
      - 'compose.nas.yaml'
      - 'LICENSE'
      - '.dockerignore'
      - 'scripts/Dockerfile'
      - 'scripts/entrypoint.sh'
      - 'scripts/entrypoint_test.sh'
      - 'scripts/release_smoke_test.sh'
      - 'scripts/release_version.sh'
      - 'scripts/cat_two_docker_release.py'
      - '.github/actions/setup-web/**'
      - '.github/workflows/cat-two-container.yml'
  workflow_dispatch:
    inputs:
      registry:
        description: Image registry
        type: choice
        options:
          - dockerhub
          - ghcr
        default: dockerhub

concurrency:
  # Serialize releases separately so an ordinary push cannot replace a pending publish.
  group: cat-two-container-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish dockerhub]'))) && github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and smoke-test the container
    if: github.repository == 'Tiger-zero/Cat_two' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check changed container inputs
        id: scope
        if: github.event_name == 'push' && !github.event.created && !github.event.forced && !contains(github.event.head_commit.message, '[publish dockerhub]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # GitHub lists the entire file diff on page one, capped at 300 paths.
          # Check both paths of a rename and verify whenever the diff is uncertain.
          if gh api "repos/$GITHUB_REPOSITORY/compare/$PUSH_BEFORE...$PUSH_AFTER?page=1&per_page=1" |
            jq -e '
              # Match the pull_request path filters above.
              def container_input:
                (endswith(".go") and (endswith("_test.go") | not))
                or test("^(web/|server/frontend/dist/|store/(migration|seed)/|[.]github/actions/setup-web/)")
                or IN(
                  "go.mod", "go.sum", "proto/gen/openapi.yaml", "compose.yaml", "compose.nas.yaml",
                  "LICENSE", ".dockerignore", "scripts/Dockerfile", "scripts/entrypoint.sh",
                  "scripts/entrypoint_test.sh", "scripts/release_smoke_test.sh", "scripts/release_version.sh",
                  "scripts/cat_two_docker_release.py", ".github/workflows/cat-two-container.yml"
                );

              (.status == "ahead" or .status == "identical")
              and (.files | type == "array" and length < 300)
              and all(.files[]; (.filename | type == "string") and
                (.status != "renamed" or (.previous_filename | type == "string")))
              and (any(.files[] | (.filename, .previous_filename) | strings; container_input) | not)
            ' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No container inputs changed."
          fi

      - uses: actions/checkout@v6
        if: steps.scope.outputs.skip != 'true'
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web
        if: steps.scope.outputs.skip != 'true'

      - name: Build the embedded web app
        if: steps.scope.outputs.skip != 'true'
        working-directory: web
        run: pnpm release

      - name: Resolve version from the commit
        id: version
        if: steps.scope.outputs.skip != 'true'
        run: |
          version="$(bash scripts/release_version.sh development-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.scope.outputs.skip != 'true'

      - name: Build the smoke-test image
        if: steps.scope.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cat-two:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=cat-two-container
          cache-to: type=gha,mode=max,scope=cat-two-container

      - name: Verify the web app and persistent SQLite data
        if: steps.scope.outputs.skip != 'true'
        run: |
          bash scripts/entrypoint_test.sh
          docker compose config --quiet
          docker compose -f compose.nas.yaml config --quiet
          bash scripts/release_smoke_test.sh --fresh-only --candidate-image cat-two:smoke

      - name: Save the tested web build for publishing
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish dockerhub]'))
        uses: actions/upload-artifact@v6
        with:
          name: cat-two-frontend
          path: server/frontend/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the container image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish dockerhub]'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: cat-two-frontend
          path: server/frontend/dist

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Set image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry == 'ghcr' && format('ghcr.io/{0}', github.repository) || 'docker.io/tiger2896/cat_two' }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.registry == 'ghcr' }}
            type=sha,format=long
          labels: |
            io.github.tiger-zero.cat-two.release-run=${{ github.run_number }}

      - name: Sign in to Docker Hub
        if: inputs.registry != 'ghcr'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign in to GitHub Container Registry
        if: inputs.registry == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish amd64 and arm64 images
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=cat-two-container

      - name: Publish the numbered Docker Hub release and latest
        if: inputs.registry != 'ghcr'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/cat_two_docker_release.py "$IMAGE_DIGEST" "$GITHUB_RUN_NUMBER"
