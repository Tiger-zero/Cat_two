name: Cat_two Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'server/frontend/dist/**'
      - 'store/migration/**'
      - 'store/seed/**'
      - 'compose.yaml'
      - '.dockerignore'
      - 'scripts/Dockerfile'
      - 'scripts/entrypoint.sh'
      - 'scripts/release_smoke_test.sh'
      - 'scripts/release_version.sh'
      - '.github/actions/setup-web/**'
      - '.github/workflows/cat-two-container.yml'
  workflow_dispatch:

concurrency:
  group: cat-two-container-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and smoke-test the container
    if: github.repository == 'Tiger-zero/Cat_two' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - name: Build the embedded web app
        working-directory: web
        run: pnpm release

      - name: Resolve version from the commit
        id: version
        run: |
          version="$(bash scripts/release_version.sh development-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build the smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cat-two:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=cat-two-container
          cache-to: type=gha,mode=max,scope=cat-two-container

      - name: Verify the web app and persistent SQLite data
        run: |
          docker compose config --quiet
          bash scripts/release_smoke_test.sh --fresh-only --candidate-image cat-two:smoke

      - name: Save the tested web build for publishing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: cat-two-frontend
          path: server/frontend/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GitHub Container Registry
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: cat-two-frontend
          path: server/frontend/dist

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=cat-two-container
