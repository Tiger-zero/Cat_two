name: Bug Report
description: Report something that is not working as expected
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Search [Cat_two issues](https://github.com/Tiger-zero/Cat_two/issues) for duplicates and check the [Docker Hub image tags](https://hub.docker.com/r/tiger2896/cat_two/tags). For vulnerabilities, see the [security policy](https://github.com/Tiger-zero/Cat_two/security).

  - type: checkboxes
    id: pre-check
    attributes:
      label: Check before submitting
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Tell us what happened and what you expected instead.
      placeholder: |
        What happened:
        What I expected:
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Give us the shortest steps that reproduce the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Cat_two version
      description: Provide the Docker image tag or the version and commit returned by GET /api/instance/profile.
      placeholder: "Docker tag 0.16"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add relevant deployment details, logs, screenshots, or recordings. Remove secrets before submitting.
      placeholder: |
        Deployment / database / browser:
        Logs or screenshots:
